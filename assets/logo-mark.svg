<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="40" height="40" rx="10"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="40" height="40" rx="10" fill="url(#bg)"/>

  <!-- Orbital ring (rotated ellipse — the quantum element) -->
  <g clip-path="url(#clip)">
    <ellipse cx="20" cy="19" rx="16" ry="6"
      stroke="rgba(255,255,255,0.3)" stroke-width="1.4"
      fill="none" transform="rotate(-38 20 19)"/>
  </g>

  <!-- Q — outer circle -->
  <circle cx="19.5" cy="18.5" r="8.5"
    stroke="white" stroke-width="2.2" fill="none" opacity="0.95"/>

  <!-- Q — tail stroke -->
  <path d="M25 23.5 L30 29" stroke="white" stroke-width="2.2"
    stroke-linecap="round" opacity="0.95"/>

  <!-- Q — inner dot -->
  <circle cx="19.5" cy="18.5" r="2.2" fill="white" opacity="0.9"/>
</svg>
